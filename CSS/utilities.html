<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  span {
    display: inline-block;
    width: 70px;
    height: 70px;
    margin: 6px;
    background-color: #f9f9f9;
  }
  </style>
</head>
<body>  
<div class="container mt-3">
  <h2>Lê Hoàng Nam 2221050640</h2>
  <p>Lê Hoàng Nam 2221050640</p> 

  <span class="border">Lê Hoàng Nam 2221050640</span>
  <span class="border border-0">Lê Hoàng Nam 2221050640</span>
  <span class="border border-top-0">Lê Hoàng Nam 2221050640</span>
  <span class="border border-end-0">Lê Hoàng Nam 2221050640</span>
  <span class="border border-bottom-0">Lê Hoàng Nam 2221050640</span>
  <span class="border border-start-0">Lê Hoàng Nam 2221050640</span>
  <br>
  
  <span class="border-top">Lê Hoàng Nam 2221050640</span>
  <span class="border-end">Lê Hoàng Nam 2221050640</span>
  <span class="border-bottom">Lê Hoàng Nam 2221050640</span>
  <span class="border-start">Lê Hoàng Nam 2221050640</span>
</div>

</body>
</html>
