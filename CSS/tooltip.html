<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-3">
  <h3>Lê Hoàng Nam 2221050640</h3>
  <p>Lê Hoàng Nam 2221050640</p>
  <a href="#" data-bs-toggle="tooltip" data-bs-placement="top" title="Hooray!">Lê Hoàng Nam 2221050640</a>
  <a href="#" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Hooray!">Lê Hoàng Nam 2221050640</a>
  <a href="#" data-bs-toggle="tooltip" data-bs-placement="left" title="Hooray!">Lê Hoàng Nam 2221050640</a>
  <a href="#" data-bs-toggle="tooltip" data-bs-placement="right" title="Hooray!">Lê Hoàng Nam 2221050640</a>
</div>

<script>
var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
  return new bootstrap.Tooltip(tooltipTriggerEl)
})
</script>

</body>
</html>
